<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serviço de Estoque</title>
  <style>
    :root {
      --bg: #f4f6f8; --card: #ffffff; --text: #1d2733; --muted: #5f6b7a;
      --line: #dde3ea; --accent: #0f766e; --accent-soft: #e6f4f2;
      --ok: #15803d; --ok-soft: #e7f6ec; --warn: #b45309; --warn-soft: #fdf1e3;
      --err: #b91c1c; --err-soft: #fdecec;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
           background: var(--bg); color: var(--text); font-size: 14px; }
    header { background: var(--accent); color: #fff; padding: 14px 20px;
             display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 19px; margin: 0; font-weight: 600; }
    .tag { background: rgba(255,255,255,.18); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
    .status { margin-left: auto; font-size: 12px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; }
    .dot.on { background: #4ade80; }
    main { padding: 16px; display: grid; gap: 14px; max-width: 980px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
    .card h2 { font-size: 15px; margin: 0 0 10px; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; align-items: end; }
    label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
    input, select { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px;
                    background: #fff; color: var(--text); min-width: 0; }
    input:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    button { font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0;
             border-radius: 7px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
    button:hover { filter: brightness(1.08); }
    .msg { border-radius: 8px; padding: 9px 12px; font-size: 13px; display: none; }
    .msg.ok { display: block; background: var(--ok-soft); color: var(--ok); }
    .msg.erro { display: block; background: var(--err-soft); color: var(--err); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
    th { font-size: 12px; color: var(--muted); font-weight: 600; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .badge { border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; }
    .badge.ok { background: var(--ok-soft); color: var(--ok); }
    .badge.repor { background: var(--warn-soft); color: var(--warn); }
    .vazio { color: var(--muted); text-align: center; padding: 18px; }
    @keyframes piscar { from { background: #fde68a; } to { background: transparent; } }
    .mudou { animation: piscar 1.6s ease-out; }
  </style>
</head>
<body>
  <header>
    <h1>Serviço de Estoque</h1>
    <span class="tag">Aplicação 1 · API REST</span>
    <span class="status"><span id="saude" class="dot"></span><span id="saude-txt">verificando…</span></span>
  </header>
  <main>
    <div id="mensagem" class="msg" role="status"></div>

    <section class="card">
      <h2>Cadastrar produto</h2>
      <form id="form-produto">
        <label>SKU <input id="sku" required placeholder="TEC-001"></label>
        <label style="grid-column: span 2">Nome <input id="nome" required placeholder="Teclado mecânico"></label>
        <label>Preço (R$) <input id="preco" required inputmode="decimal" placeholder="250.00"></label>
        <label>Qtd. inicial <input id="quantidade" type="number" min="0" value="0"></label>
        <label>Estoque mín. <input id="estoque_minimo" type="number" min="0" value="0"></label>
        <button id="btn-cadastrar" type="submit">Cadastrar</button>
      </form>
    </section>

    <section class="card">
      <h2>Registrar entrada (reposição)</h2>
      <form id="form-entrada">
        <label style="grid-column: span 2">Produto <select id="entrada-sku"></select></label>
        <label>Quantidade <input id="entrada-quantidade" type="number" min="1" value="1"></label>
        <button id="btn-entrada" type="submit">Registrar</button>
      </form>
    </section>

    <section class="card">
      <h2>Produtos em estoque</h2>
      <table>
        <thead><tr><th>SKU</th><th>Nome</th><th class="num">Preço</th><th class="num">Saldo</th>
          <th class="num">Mínimo</th><th>Situação</th></tr></thead>
        <tbody id="tabela-produtos"><tr><td colspan="6" class="vazio">Nenhum produto cadastrado.</td></tr></tbody>
      </table>
    </section>
  </main>

  <script>
    const moeda = v => Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    const saldosAnteriores = {};

    function mostrar(texto, tipo) {
      const el = document.getElementById("mensagem");
      el.textContent = texto;
      el.className = "msg " + tipo;
    }

    async function api(caminho, opcoes = {}) {
      const resp = await fetch(caminho, {
        headers: { "Content-Type": "application/json" }, ...opcoes,
      });
      const corpo = await resp.json();
      if (!resp.ok) throw new Error(corpo.erro || ("HTTP " + resp.status));
      return corpo;
    }

    function escapar(t) {
      const d = document.createElement("div"); d.textContent = t; return d.innerHTML;
    }

    async function carregar() {
      try {
        const produtos = await api("/api/produtos");
        document.getElementById("saude").classList.add("on");
        document.getElementById("saude-txt").textContent = "online";
        const corpo = document.getElementById("tabela-produtos");
        if (!produtos.length) {
          corpo.innerHTML = '<tr><td colspan="6" class="vazio">Nenhum produto cadastrado.</td></tr>';
        } else {
          corpo.innerHTML = produtos.map(p => {
            const mudou = p.sku in saldosAnteriores && saldosAnteriores[p.sku] !== p.quantidade;
            return `<tr data-sku="${escapar(p.sku)}">
              <td><strong>${escapar(p.sku)}</strong></td><td>${escapar(p.nome)}</td>
              <td class="num">${moeda(p.preco)}</td>
              <td class="num saldo ${mudou ? "mudou" : ""}">${p.quantidade}</td>
              <td class="num">${p.estoque_minimo}</td>
              <td>${p.precisa_reposicao ? '<span class="badge repor">Repor</span>' : '<span class="badge ok">OK</span>'}</td>
            </tr>`;
          }).join("");
        }
        produtos.forEach(p => { saldosAnteriores[p.sku] = p.quantidade; });
        const select = document.getElementById("entrada-sku");
        const atual = select.value;
        select.innerHTML = produtos.map(p => `<option value="${escapar(p.sku)}">${escapar(p.sku)} — ${escapar(p.nome)}</option>`).join("");
        if (atual) select.value = atual;
      } catch (e) {
        document.getElementById("saude").classList.remove("on");
        document.getElementById("saude-txt").textContent = "offline";
      }
    }

    document.getElementById("form-produto").addEventListener("submit", async ev => {
      ev.preventDefault();
      const dados = {
        sku: document.getElementById("sku").value,
        nome: document.getElementById("nome").value,
        preco: document.getElementById("preco").value.replace(",", "."),
        quantidade: parseInt(document.getElementById("quantidade").value || "0", 10),
        estoque_minimo: parseInt(document.getElementById("estoque_minimo").value || "0", 10),
      };
      try {
        const p = await api("/api/produtos", { method: "POST", body: JSON.stringify(dados) });
        mostrar(`Produto ${p.sku} cadastrado com saldo ${p.quantidade}.`, "ok");
        ev.target.reset();
        await carregar();
      } catch (e) { mostrar(e.message, "erro"); }
    });

    document.getElementById("form-entrada").addEventListener("submit", async ev => {
      ev.preventDefault();
      const sku = document.getElementById("entrada-sku").value;
      const quantidade = parseInt(document.getElementById("entrada-quantidade").value || "0", 10);
      try {
        const p = await api(`/api/produtos/${encodeURIComponent(sku)}/entradas`,
                            { method: "POST", body: JSON.stringify({ quantidade }) });
        mostrar(`Entrada registrada: ${p.sku} agora tem ${p.quantidade} unidades.`, "ok");
        await carregar();
      } catch (e) { mostrar(e.message, "erro"); }
    });

    carregar();
    setInterval(carregar, 1500);
  </script>
</body>
</html>
